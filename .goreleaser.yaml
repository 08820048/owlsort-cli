# GoReleaser configuration (v2). `make snapshot` builds every platform locally;
# `make release-check` is what CI runs on every push, so this file can never rot
# unnoticed again the way it did before its first real run (roadmap.md, M4).
version: 2

project_name: owlsort

before:
  hooks:
    # The archives carry the licence and the two documents a user may need before
    # they run anything (TRADEMARK explains what the name is not covered by).
    - go mod verify

builds:
  - id: owlsort
    main: ./cmd/owlsort
    binary: owlsort
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - TRADEMARK.md

checksum:
  name_template: checksums.txt

# The release notes are the hand-written entry in CHANGELOG.md: one sentence per
# change, what was done and nothing else. A changelog generated from commit
# messages would be a paragraph per line and would say it a second, differently
# worded way.
changelog:
  disable: true

release:
  # A tag that does not start with "v" is a mistake, not a release.
  mode: replace
  name_template: "{{ .Tag }}"
  header: |
    See [CHANGELOG.md](https://github.com/08820048/owlsort-cli/blob/main/CHANGELOG.md)
    for what changed in this version.
  footer: |
    **Before you tidy anything real:** `owlsort preview` moves nothing. Run it first.

    macOS binaries are not signed or notarized, so a downloaded one is blocked by
    Gatekeeper until you allow it (see docs/install.md). Building from source with
    `go install github.com/08820048/owlsort-cli/cmd/owlsort@latest` avoids that.

